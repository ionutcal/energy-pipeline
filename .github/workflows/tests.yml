name: teste

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Testele ruleaza pe SQLite in memorie: nu cer token ENTSO-E si nici PostgreSQL.
      - run: pytest tests/ -v
