name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    services:
      # Only used by the postgresql leg; the sqlite leg ignores it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: energy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d energy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # No ENTSO-E token needed: the API is faked in the tests.
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg2://postgres:postgres@localhost:5432/energy_test' || 'sqlite://' }}
        run: pytest tests/ -v
